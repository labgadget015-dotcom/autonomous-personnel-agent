name: CD

on:
  push:
    branches: [main]
    # Only run CD when code that affects the image actually changes
    paths:
      - "api/**"
      - "db/schema.sql"
      - ".github/workflows/cd.yml"

# Only one CD run at a time on main
concurrency:
  group: cd-main
  cancel-in-progress: false   # don't cancel CD — let it finish

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/autonomous-personnel-agent

jobs:
  # ============================================================
  # JOB: Build multi-arch image and push to GHCR
  # ============================================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-22.04
    # Required permissions for GHCR push and OIDC provenance
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Derive version from git ----
      - name: Derive image version
        id: version
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          DATE="$(date -u +%Y%m%d)"
          VERSION="${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${VERSION}"

      # ---- Set up QEMU for cross-platform builds (arm64 + amd64) ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # ---- Set up Docker Buildx ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use the GitHub Actions cache backend for layer caching
          driver-opts: image=moby/buildkit:latest

      # ---- Authenticate to GHCR ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Generate image tags and labels ----
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Immutable tag: date + short SHA (e.g. 20260417-a3f9b2c)
            type=raw,value=${{ steps.version.outputs.version }}
            # Latest on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # SHA tag for precise rollback
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Autonomous Personnel Agent API
            org.opencontainers.image.description=Multi-agent personnel management — FastAPI + LangChain + PostgreSQL
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # ---- Build and push (multi-arch: amd64 + arm64) ----
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          dockerfile: ./api/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: store in GHCR itself (no extra storage needed)
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Build args for version info embedded in the image
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # ---- Attest provenance (SLSA level 3) ----
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---- Summary ----
      - name: Write job summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | \`ghcr.io\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pull" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "# or pin to exact version:" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB: Post-push smoke test — pull the image and run /health
  # ============================================================
  smoke-test:
    name: Smoke Test (GHCR image)
    runs-on: ubuntu-22.04
    needs: build-and-push
    permissions:
      packages: read

    steps:
      - name: Log in to GHCR (pull)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}

      - name: Start container with dummy config
        run: |
          docker run -d \
            --name smoke-api \
            -p 8000:8000 \
            -e OPENAI_API_KEY=sk-smoke-test-dummy \
            -e API_TOKEN=smoke-token \
            -e ENV=development \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}

      - name: Wait for service to start
        run: |
          echo "Waiting for API to become ready..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "  Service ready after ${i}s"
              exit 0
            fi
            echo "  Attempt ${i}/20 — waiting..."
            sleep 3
          done
          echo "ERROR: Service did not become ready in 60s"
          docker logs smoke-api
          exit 1

      - name: Verify /health response
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Health response: $RESPONSE"

          # Validate expected fields are present
          python3 - << 'PYEOF'
          import json, sys

          response = json.loads(''''"'"'$(curl -sf http://localhost:8000/health)'"'"''')

          required = ["status", "service", "version", "timestamp"]
          missing = [f for f in required if f not in response]
          if missing:
              print(f"FAIL: /health missing fields: {missing}")
              sys.exit(1)

          if response["status"] not in ("ok", "degraded"):
              print(f"FAIL: unexpected status '{response['status']}'")
              sys.exit(1)

          print(f"PASS: /health returned status='{response['status']}'")
          PYEOF

      - name: Verify /docs is reachable (Swagger UI)
        run: |
          STATUS=$(curl -so /dev/null -w "%{http_code}" http://localhost:8000/docs)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /docs returned HTTP $STATUS"
            exit 1
          fi
          echo "PASS: /docs is reachable (HTTP $STATUS)"

      - name: Print container logs on failure
        if: failure()
        run: docker logs smoke-api

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-api || true

  # ============================================================
  # JOB: Update docker-compose to pin to the new image digest
  # (optional — creates a PR if compose is using :latest)
  # ============================================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-22.04
    needs: [build-and-push, smoke-test]
    if: success()

    steps:
      - name: Post deployment summary
        run: |
          echo "## CD Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image built, pushed, and smoke-tested successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**To deploy locally with the new image:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose pull api" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d api" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ needs.build-and-push.outputs.image-digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB: Integration tests — real Postgres + live API server
  # Runs AFTER smoke-test; only on pushes to main (not PRs)
  # ============================================================
  integration-test:
    name: Integration Tests (Postgres + API)
    runs-on: ubuntu-22.04
    needs: [smoke-test]
    permissions:
      contents: read

    # ---- Real Postgres service container ----
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: personnel_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d personnel_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Used by conftest.py live_app fixture
      TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/personnel_agent_test
      # Dummy LLM key — all LLM calls are mocked in tests
      OPENAI_API_KEY: sk-integration-test-dummy
      API_TOKEN: test-token-ci
      ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Python setup ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio httpx psycopg2-binary

      # ---- Apply schema to test DB ----
      - name: Apply schema migration
        run: |
          echo "Applying db/schema.sql to test database..."
          PGPASSWORD=testpass psql \
            -h localhost \
            -U testuser \
            -d personnel_agent_test \
            -f db/schema.sql
          echo "Schema applied."

      # ---- Verify schema objects exist ----
      - name: Verify schema objects
        run: |
          PGPASSWORD=testpass psql \
            -h localhost -U testuser -d personnel_agent_test \
            -c "\dt" | grep -E "people|interactions|tasks|events|roles" \
            || (echo "FAIL: expected tables not found after migration" && exit 1)
          echo "PASS: core tables verified."

      # ---- Start API server in background ----
      - name: Start FastAPI server
        run: |
          export DATABASE_URL="$TEST_DATABASE_URL"
          cd api
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          echo "Waiting for API to become ready..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health/live > /dev/null 2>&1; then
              echo "  API ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: API did not start within 40s"
          exit 1

      # ---- Run full test suite ----
      - name: Run pytest integration suite
        run: |
          pytest api/tests/ \
            -v \
            --tb=short \
            --junit-xml=test-results/integration.xml \
            -p no:cacheprovider \
            2>&1 | tee test-output.txt

      # ---- Upload test results (always, so failures are inspectable) ----
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-${{ needs.build-and-push.outputs.version || github.sha }}
          path: |
            test-results/
            test-output.txt
          retention-days: 14

      # ---- Summary ----
      - name: Write test summary
        if: always()
        run: |
          echo "## Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.txt ]; then
            # Extract pass/fail counts from pytest output
            SUMMARY=$(grep -E "passed|failed|error" test-output.txt | tail -1 || echo "See full output in artifact")
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Database:** PostgreSQL 16 (ephemeral, test-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Schema:** Applied from \`db/schema.sql\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Test files:** \`api/tests/test_schema.py\`, \`api/tests/test_endpoints.py\`" >> "$GITHUB_STEP_SUMMARY"

      # ---- Stop API server ----
      - name: Stop API server
        if: always()
        run: |
          if [ -n "$API_PID" ]; then
            kill "$API_PID" 2>/dev/null || true
          fi

  # ============================================================
  # GATE: All checks must pass before reporting overall success
  # ============================================================
  all-checks:
    name: All CD Checks Passed
    runs-on: ubuntu-22.04
    needs: [build-and-push, smoke-test, integration-test]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.build-and-push.result }}" != "success" || \
                "${{ needs.smoke-test.result }}" != "success" || \
                "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "One or more CD jobs failed:"
            echo "  build-and-push: ${{ needs.build-and-push.result }}"
            echo "  smoke-test:     ${{ needs.smoke-test.result }}"
            echo "  integration-test: ${{ needs.integration-test.result }}"
            exit 1
          fi
          echo "All CD jobs passed."
