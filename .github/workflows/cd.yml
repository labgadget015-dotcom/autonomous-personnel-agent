name: CD

on:
  push:
    branches: [main]
    # Only run CD when code that affects the image actually changes
    paths:
      - "api/**"
      - "db/schema.sql"
      - ".github/workflows/cd.yml"

# Only one CD run at a time on main
concurrency:
  group: cd-main
  cancel-in-progress: false   # don't cancel CD — let it finish

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/autonomous-personnel-agent

jobs:
  # ============================================================
  # JOB: Build multi-arch image and push to GHCR
  # ============================================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-22.04
    # Required permissions for GHCR push and OIDC provenance
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Derive version from git ----
      - name: Derive image version
        id: version
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          DATE="$(date -u +%Y%m%d)"
          VERSION="${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${VERSION}"

      # ---- Set up QEMU for cross-platform builds (arm64 + amd64) ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # ---- Set up Docker Buildx ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use the GitHub Actions cache backend for layer caching
          driver-opts: image=moby/buildkit:latest

      # ---- Authenticate to GHCR ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Generate image tags and labels ----
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Immutable tag: date + short SHA (e.g. 20260417-a3f9b2c)
            type=raw,value=${{ steps.version.outputs.version }}
            # Latest on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # SHA tag for precise rollback
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Autonomous Personnel Agent API
            org.opencontainers.image.description=Multi-agent personnel management — FastAPI + LangChain + PostgreSQL
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # ---- Build and push (multi-arch: amd64 + arm64) ----
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          dockerfile: ./api/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: store in GHCR itself (no extra storage needed)
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Build args for version info embedded in the image
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # ---- Attest provenance (SLSA level 3) ----
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ---- Summary ----
      - name: Write job summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | \`ghcr.io\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pull" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "# or pin to exact version:" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB: Post-push smoke test — pull the image and run /health
  # ============================================================
  smoke-test:
    name: Smoke Test (GHCR image)
    runs-on: ubuntu-22.04
    needs: build-and-push
    permissions:
      packages: read

    steps:
      - name: Log in to GHCR (pull)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}

      - name: Start container with dummy config
        run: |
          docker run -d \
            --name smoke-api \
            -p 8000:8000 \
            -e OPENAI_API_KEY=sk-smoke-test-dummy \
            -e API_TOKEN=smoke-token \
            -e ENV=development \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}

      - name: Wait for service to start
        run: |
          echo "Waiting for API to become ready..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "  Service ready after ${i}s"
              exit 0
            fi
            echo "  Attempt ${i}/20 — waiting..."
            sleep 3
          done
          echo "ERROR: Service did not become ready in 60s"
          docker logs smoke-api
          exit 1

      - name: Verify /health response
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Health response: $RESPONSE"

          # Validate expected fields are present
          python3 - << 'PYEOF'
          import json, sys

          response = json.loads(''''"'"'$(curl -sf http://localhost:8000/health)'"'"''')

          required = ["status", "service", "version", "timestamp"]
          missing = [f for f in required if f not in response]
          if missing:
              print(f"FAIL: /health missing fields: {missing}")
              sys.exit(1)

          if response["status"] not in ("ok", "degraded"):
              print(f"FAIL: unexpected status '{response['status']}'")
              sys.exit(1)

          print(f"PASS: /health returned status='{response['status']}'")
          PYEOF

      - name: Verify /docs is reachable (Swagger UI)
        run: |
          STATUS=$(curl -so /dev/null -w "%{http_code}" http://localhost:8000/docs)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /docs returned HTTP $STATUS"
            exit 1
          fi
          echo "PASS: /docs is reachable (HTTP $STATUS)"

      - name: Print container logs on failure
        if: failure()
        run: docker logs smoke-api

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-api || true

  # ============================================================
  # JOB: Update docker-compose to pin to the new image digest
  # (optional — creates a PR if compose is using :latest)
  # ============================================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-22.04
    needs: [build-and-push, smoke-test]
    if: success()

    steps:
      - name: Post deployment summary
        run: |
          echo "## CD Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image built, pushed, and smoke-tested successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**To deploy locally with the new image:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose pull api" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose up -d api" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ needs.build-and-push.outputs.image-digest }}\`" >> "$GITHUB_STEP_SUMMARY"
