[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "C4", "PIE", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (ok in tests)
    "S105",   # hardcoded password (false positives on env var names)
    "S106",   # hardcoded password in func arg
    "S603",   # subprocess without shell=True
    "S607",   # partial path in subprocess
    "B008",   # do not perform function call in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "guardrails", "main"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["venv/", ".venv/", "build/"]
