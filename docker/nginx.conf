server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (dashboard has no versioned assets, so short TTL)
    location ~* \.(js|css|png|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Proxy /api/* → FastAPI service (allows dashboard to call API without CORS)
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check endpoint for Docker
    location /ping {
        return 200 "pong\n";
        add_header Content-Type text/plain;
    }

    # Suppress access logs for health checks
    location = /favicon.ico { access_log off; log_not_found off; }
}
